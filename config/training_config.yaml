model:
  base_id: "meta-llama/Llama-3.2-3B-Instruct"
  hub_id: "LucasSGarrido/llama-3.2-3b-medqa"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: "none"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

training:
  epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  max_seq_length: 1024
  fp16: true
  logging_steps: 50
  save_steps: 200
  eval_steps: 200

dataset:
  id: "medalpaca/medical_meadow_medqa"
  max_train: 8000
  max_val: 500
  seed: 42
